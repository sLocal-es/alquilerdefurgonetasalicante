name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  # Red de seguridad antes de tocar produccion: si alguien empuja a main sin
  # pasar por el check del PR, el deploy no sale con la suite en rojo.
  # Port del contrato de CI del engine (sLocal-toolbox @121a573): este sitio
  # aun no tiene lint ni e2e (no hay src/config); llegan con la migracion a la
  # estructura del motor, y entonces este job se iguala al template.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Comprobar credenciales de Cloudflare
        # Un API token caducado o sin permisos falla aqui, con un mensaje
        # claro, en vez de fallar mas abajo con un error de API criptico.
        # Comprobarlo antes del build ahorra el tiempo de la suite.
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Post-deploy smoke test
        run: node scripts/smoke-test.mjs https://alquilerdefurgonetasalicante.es
