name: PR Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Required check: guarantees the site builds before a PR can be merged.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run build

  # Non-blocking: uploads a Worker version and posts its preview URL on the PR.
  preview:
    name: preview
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Upload preview version
        id: upload
        run: |
          # El `|| true` deja ver el error del wrangler en el log: el
          # script muere silenciosamente si el capture del output falla.
          OUTPUT=$(npx wrangler versions upload 2>&1) || true
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' | head -1 || true)
          if [ -z "$URL" ]; then
            echo "##[error]El upload de la version preview no devolvio URL — revisa el output de arriba"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on the PR
        if: steps.upload.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.upload.outputs.url }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🔎 **Vista previa lista:** ${url}\n\n> Es una versión de prueba. No afecta a la web en producción.`
            });
