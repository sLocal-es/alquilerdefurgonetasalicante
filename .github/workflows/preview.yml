name: PR Verification

on:
  pull_request:
    branches: [main]

# Este workflow no usa ningun secret a proposito: el codigo que ejecuta viene
# del PR, asi que cualquier credencial de produccion en este job permitiria a
# una rama robarla (un `npm ci` del PR puede exportar PATH a $GITHUB_ENV y
# secuestrar el binario que se ejecute despues). El despliegue con credenciales
# vive en deploy.yml, que solo corre al hacer push a main.
# Port del contrato de CI del engine (sLocal-toolbox @121a573): el upload de
# versiones preview con el token de cuenta desaparece. Los pasos de lint y e2e
# del template llegan con la migracion a la estructura del motor.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Required check: garantiza que la suite y el build pasan antes de mergear.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm test
